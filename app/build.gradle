plugins {
    id 'com.android.application'
}

def stableTestKeystore = rootProject.file('ci/field-photo-prep-team-test.jks')
def roomSchemaDir = file("$projectDir/schemas")

android {
    namespace 'com.inandout.fieldphotoprep.team.internal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.inandout.fieldphotoprep.team.internal'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3-phase3a-room-internal'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": roomSchemaDir.path,
                    "room.incremental": "true"
                ]
            }
        }
    }

    // Public, non-production signer used only so internal test APK updates are stable.
    signingConfigs {
        stableTest {
            storeFile stableTestKeystore
            storePassword 'field-photo-prep-team-test'
            keyAlias 'field-photo-prep-team-test'
            keyPassword 'field-photo-prep-team-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
