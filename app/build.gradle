plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inandout.fieldphotoprep.team.internal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.inandout.fieldphotoprep.team.internal'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-team-shell-internal'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
