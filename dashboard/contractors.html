<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Photo Prep Team Contractors</title>
  <link rel="stylesheet" href="styles.css?v=phase8b-invite-20260915-1">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="row between gap">
        <div>
          <p class="eyebrow">Field Photo Prep Team</p>
          <h1>Contractors</h1>
          <p class="muted">Invite a Contractor without handling their password. Seat limits and account roles are enforced by the server.</p>
        </div>
        <a href="index.html">Back to Work Orders</a>
      </div>

      <div id="auth-status" class="check" role="status" aria-live="polite">Checking Admin session…</div>

      <section class="admin-action hidden" id="contractor-section" aria-labelledby="invite-heading">
        <h2 id="invite-heading">Invite Contractor</h2>
        <p id="seat-summary" class="muted">Loading Contractor seats…</p>

        <form id="invite-form" class="admin-form" autocomplete="off">
          <label>Contractor name
            <input id="contractor-name" name="contractor-name" type="text" required maxlength="200" placeholder="Test Contractor">
          </label>

          <label>Contractor email
            <input id="contractor-email" name="contractor-email" type="email" required maxlength="320" autocomplete="off" placeholder="contractor@example.com">
          </label>

          <button id="invite-contractor" type="submit">Send Invitation</button>
          <p id="invite-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>
  <script src="contractors.js?v=phase8b-invite-20260915-1" defer></script>
</body>
</html>
