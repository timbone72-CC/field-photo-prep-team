name: Create Phase 2 disposable contractor fixture

on:
  push:
    branches:
      - fix/phase-2-contractor-only-assignees

permissions:
  contents: read

jobs:
  create-fixture:
    if: github.event.head_commit.message == 'chore: create Phase 2 disposable contractor fixture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create genuine Supabase Auth test user
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_URL='https://vyocaujuwrivoqynvitm.supabase.co'
          PUBLISHABLE_KEY='sb_publishable_UPmj_Y10-mLwJo7soekCpg_BYZ08LNZ'
          EMAIL="phase2-disposable-${GITHUB_RUN_ID}@example.com"
          PASSWORD="$(openssl rand -base64 32 | tr -d '\n')Aa1!"

          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({"email": os.environ["EMAIL"], "password": os.environ["PASSWORD"]}))
          PY
          )

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "${PROJECT_URL}/auth/v1/signup" \
            -H "apikey: ${PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "${BODY}")

          USER_ID=$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("user") or d).get("id", ""))')
          if [ -z "$USER_ID" ]; then
            echo "Supabase signup response did not contain a user id" >&2
            exit 1
          fi

          echo "Created disposable Auth user: ${EMAIL}"
          echo "User id: ${USER_ID}"
        env:
          EMAIL: phase2-placeholder@example.com
          PASSWORD: placeholder
