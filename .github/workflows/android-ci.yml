name: Android Team Client CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Reject client secrets and test-account PII
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sb_secret_|service_role' app/src/main; then
            echo 'Forbidden elevated Supabase credential reference found in Android client source.' >&2
            exit 1
          fi
          if grep -R -n -E 'timbone72@gmail\.com|rushingl27@gmail\.com' app/src/main; then
            echo 'Test-account email must not be committed to Android client source.' >&2
            exit 1
          fi
      - name: Verify contractor receipt and reassignment consent paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'acknowledge_assignment_received' app/src/main/java/com/inandout/fieldphotoprep/team/internal/SupabaseApi.java
          grep -q 'respond_reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/SupabaseApi.java
          grep -q 'Approve Reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
          grep -q 'Decline Reassignment' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
          grep -q 'Assignment receipt: Confirmed' app/src/main/java/com/inandout/fieldphotoprep/team/internal/MainActivity.java
      - name: Build internal Team APK
        run: gradle :app:assembleDebug
      - name: Verify Team client identity and network permission
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -f "${APK}"
          test -n "${AAPT}"
          "${AAPT}" dump badging "${APK}" | tee apk-badging.txt
          grep -q "package: name='com.inandout.fieldphotoprep.team.internal'" apk-badging.txt
          grep -q "application-label:'Field Photo Prep Team Internal'" apk-badging.txt
          "${AAPT}" dump permissions "${APK}" | tee apk-permissions.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
      - name: Verify stable Team test APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --print-certs "${APK}" > apk-signer.txt
          cat apk-signer.txt
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          expected = "1bbff192f97a8a24c6f812d77df6847eb9759b3afb3c4b210d9e6c251f4eecfe"
          text = pathlib.Path("apk-signer.txt").read_text(encoding="utf-8")
          match = re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F]+)", text, re.IGNORECASE)
          if not match:
              print("Could not locate the APK certificate SHA-256 digest in apksigner output.", file=sys.stderr)
              sys.exit(1)
          actual = match.group(1).lower()
          print(f"Expected signer SHA-256: {expected}")
          print(f"Actual signer SHA-256:   {actual}")
          if actual != expected:
              sys.exit(1)
          PY
      - name: Upload Phase 2 contractor APK
        uses: actions/upload-artifact@v4
        with:
          name: field-photo-prep-team-phase2-consent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
